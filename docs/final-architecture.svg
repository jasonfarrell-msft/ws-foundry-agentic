<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1230" viewBox="10 130 1940 1230" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Foundry, MCP, and A2A workshop final architecture</title>
  <desc id="desc">A user sends an oil and gas audit request to an orchestrator prompt agent in Microsoft Foundry. The orchestrator calls status, policy, and hosted remediation agents through Agent to Agent connections. The status and remediation agents both call a shared MCP server in Azure Container Apps, which calls the Audit API, which reads and writes SQLite state. The policy agent uses Foundry IQ, which retrieves from Search over the policy corpus. Remediation requires explicit human approval.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#eef3f9"/></linearGradient>
    <linearGradient id="foundry" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eaf2ff"/><stop offset="1" stop-color="#dce9ff"/></linearGradient>
    <linearGradient id="aca" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf9f5"/><stop offset="1" stop-color="#d9f1e8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#1f2937" flood-opacity=".14"/></filter>

    <marker id="arrow-blue" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse">
      <path d="M0,0 L16,7 L0,14 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse">
      <path d="M0,0 L16,7 L0,14 Z" fill="#07875c"/>
    </marker>
    <marker id="arrow-purple" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse">
      <path d="M0,0 L16,7 L0,14 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-orange" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse">
      <path d="M0,0 L16,7 L0,14 Z" fill="#d97706"/>
    </marker>
    <marker id="arrow-gray" markerUnits="userSpaceOnUse" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto-start-reverse">
      <path d="M0,0 L16,7 L0,14 Z" fill="#64748b"/>
    </marker>

    <style>
      .title { font: 700 46px Arial, sans-serif; fill:#102a43; }
      .subtitle { font: 400 24px Arial, sans-serif; fill:#486581; }
      .boundary { stroke-width:4; rx:28; }
      .boundary-title { font:700 30px Arial, sans-serif; }
      .node-title { font:700 22px Arial, sans-serif; fill:#102a43; }
      .node-sub { font:400 18px Arial, sans-serif; fill:#334e68; }
      .badge-text { font:600 16px Arial, sans-serif; fill:#1d4ed8; }
      .label { font:700 19px Arial, sans-serif; fill:#243b53; paint-order:stroke; stroke:#f8fbff; stroke-width:8; stroke-linejoin:round; }
      .small { font:400 18px Arial, sans-serif; fill:#486581; }
      .footer { font:400 18px Arial, sans-serif; fill:#627d98; }
      .conn { fill:none; stroke-linecap:round; stroke-linejoin:round; }
    </style>
  </defs>

  <rect x="10" y="130" width="1940" height="1230" fill="#ffffff"/>

  <!-- Foundry boundary -->
  <rect x="390" y="190" width="1500" height="850" fill="url(#foundry)" stroke="#5b8def" class="boundary"/>
  <text x="440" y="245" class="boundary-title" fill="#1d4ed8">MICROSOFT FOUNDRY PROJECT • main-project</text>
  <text x="440" y="278" class="small">Model deployments, prompt agents, hosted agent runtime, managed identity, and A2A connections</text>

  <!-- User -->
  <g filter="url(#shadow)">
    <rect x="80" y="500" width="245" height="150" rx="22" fill="#ffffff" stroke="#64748b" stroke-width="3"/>
    <circle cx="145" cy="555" r="25" fill="#64748b"/>
    <path d="M105 610 Q145 570 185 610" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round"/>
    <text x="205" y="565" class="node-title">User</text>
    <text x="205" y="597" class="node-sub">audit request</text>
  </g>

  <!-- Orchestrator: x520-980, y480-670 -->
  <g filter="url(#shadow)">
    <rect x="520" y="480" width="460" height="190" rx="22" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
    <rect x="545" y="508" width="48" height="48" rx="12" fill="#2563eb"/>
    <path d="M557 532 h24 M569 520 v24" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <text x="618" y="524" class="node-title">orchestrator-</text>
    <text x="618" y="549" class="node-title">prompt-agent</text>
    <text x="618" y="580" class="node-sub">routes requests and enforces</text>
    <text x="618" y="603" class="node-sub">the approval gate</text>
    <rect x="618" y="620" width="310" height="28" rx="14" fill="#dbeafe"/>
    <text x="773" y="639" text-anchor="middle" class="badge-text">A2A caller • Agent Consumer</text>
  </g>

  <!-- Specialist agents: x1030-1460 -->
  <g filter="url(#shadow)">
    <rect x="1030" y="335" width="430" height="170" rx="22" fill="#ffffff" stroke="#07875c" stroke-width="3"/>
    <circle cx="1080" cy="385" r="24" fill="#07875c"/><path d="M1068 385 h24 M1080 373 v24" stroke="#fff" stroke-width="5"/>
    <text x="1120" y="382" class="node-title">audit-status-agent</text>
    <text x="1120" y="412" class="node-sub">live scorecard, ratings,</text>
    <text x="1120" y="437" class="node-sub">findings, root causes</text>
    <rect x="1120" y="458" width="230" height="27" rx="14" fill="#dcfce7"/><text x="1235" y="477" text-anchor="middle" class="badge-text" style="fill:#047857">Prompt + MCP</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="565" width="430" height="190" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="1080" cy="615" r="24" fill="#7c3aed"/><path d="M1068 615 h24 M1080 603 v24" stroke="#fff" stroke-width="5"/>
    <text x="1120" y="610" class="node-title">policy-audit-info-</text>
    <text x="1120" y="635" class="node-title">agent</text>
    <text x="1120" y="665" class="node-sub">policy, controls, evidence,</text>
    <text x="1120" y="690" class="node-sub">citations from Foundry IQ</text>
    <rect x="1120" y="710" width="230" height="27" rx="14" fill="#ede9fe"/><text x="1235" y="729" text-anchor="middle" class="badge-text" fill="#6d28d9">Prompt + Foundry IQ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1030" y="815" width="430" height="190" rx="22" fill="#ffffff" stroke="#d97706" stroke-width="3"/>
    <circle cx="1080" cy="865" r="24" fill="#d97706"/><path d="M1068 865 h24 M1080 853 v24" stroke="#fff" stroke-width="5"/>
    <text x="1120" y="860" class="node-title">remediation-hosted-</text>
    <text x="1120" y="885" class="node-title">agent</text>
    <text x="1120" y="915" class="node-sub">bounded update only after</text>
    <text x="1120" y="940" class="node-sub">explicit user approval</text>
    <rect x="1120" y="960" width="230" height="27" rx="14" fill="#fef3c7"/><text x="1235" y="979" text-anchor="middle" class="badge-text" fill="#92400e">Hosted C# + MCP</text>
  </g>

  <!-- Foundry IQ and Search: x1510-1840 -->
  <g filter="url(#shadow)">
    <ellipse cx="1675" cy="635" rx="165" ry="48" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <path d="M1510 635 v130 c0 27 74 48 165 48s165-21 165-48V635" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <ellipse cx="1675" cy="765" rx="165" ry="48" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <text x="1675" y="628" text-anchor="middle" class="node-title">Foundry IQ</text>
    <text x="1675" y="656" text-anchor="middle" class="node-sub">144-document policy</text>
    <text x="1675" y="681" text-anchor="middle" class="node-sub">and audit corpus</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1510" y="865" width="330" height="100" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
    <circle cx="1560" cy="912" r="16" fill="none" stroke="#7c3aed" stroke-width="5"/>
    <line x1="1572" y1="924" x2="1585" y2="937" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
    <text x="1605" y="906" class="node-title">Search</text>
    <text x="1605" y="934" class="node-sub">indexed corpus retrieval</text>
  </g>

  <!-- ACA boundary: enlarged so the title/subtitle sit clear above the content boxes -->
  <rect x="390" y="1090" width="1500" height="210" fill="url(#aca)" stroke="#07875c" class="boundary"/>
  <text x="440" y="1130" class="boundary-title" fill="#047857">AZURE CONTAINER APPS</text>
  <text x="440" y="1158" class="small">Workshop services • HTTP tool boundary</text>
  <g filter="url(#shadow)">
    <rect x="700" y="1175" width="390" height="95" rx="18" fill="#ffffff" stroke="#07875c" stroke-width="3"/>
    <text x="895" y="1213" text-anchor="middle" class="node-title">MCP server</text>
    <text x="895" y="1243" text-anchor="middle" class="node-sub">get scorecard • get detail • update</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1200" y="1175" width="390" height="95" rx="18" fill="#ffffff" stroke="#07875c" stroke-width="3"/>
    <text x="1395" y="1213" text-anchor="middle" class="node-title">Audit API</text>
    <text x="1395" y="1243" text-anchor="middle" class="node-sub">simulated FastAPI service</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="1685" y="1175" width="145" height="95" rx="18" fill="#ffffff" stroke="#07875c" stroke-width="3"/>
    <text x="1757" y="1213" text-anchor="middle" class="node-title">SQLite</text>
    <text x="1757" y="1243" text-anchor="middle" class="node-sub">state</text>
  </g>

  <!-- ============ CONNECTIONS (orthogonal, routed through clear corridors) ============ -->

  <!-- User -> Orchestrator -->
  <path class="conn" d="M325 575 H520" stroke="#64748b" stroke-width="5" marker-end="url(#arrow-gray)"/>
  <text x="422" y="560" text-anchor="middle" class="label">request</text>

  <!-- Orchestrator -> audit-status-agent (A2A) -->
  <path class="conn" d="M980 505 H1005 V420 H1030" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1008" y="405" text-anchor="middle" class="label">A2A: status</text>

  <!-- Orchestrator -> policy-audit-info-agent (A2A) -->
  <path class="conn" d="M980 575 H1005 V660 H1030" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow-blue)"/>
  <text x="1008" y="573" text-anchor="middle" class="label">A2A: policy</text>

  <!-- Orchestrator -> remediation-hosted-agent (A2A, only after approval) — originates from bottom of orchestrator box -->
  <path class="conn" d="M750 670 V910 H1030" stroke="#d97706" stroke-width="5" marker-end="url(#arrow-orange)"/>
  <text x="765" y="800" text-anchor="middle" class="label">A2A: approved plan</text>

  <!-- policy-audit-info-agent -> Foundry IQ (grounding) -->
  <path class="conn" d="M1460 660 H1510" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="1485" y="645" text-anchor="middle" class="label">grounding</text>

  <!-- Foundry IQ -> Search -->
  <path class="conn" d="M1675 813 V865" stroke="#7c3aed" stroke-width="5" marker-end="url(#arrow-purple)"/>
  <text x="1735" y="845" text-anchor="middle" class="label">search</text>

  <!-- audit-status-agent -> MCP server: routes far right around Foundry IQ/Search, then merges with remediation feed -->
  <path class="conn" d="M1460 400 H1860 V1060" stroke="#07875c" stroke-width="5"/>
  <text x="1740" y="385" text-anchor="middle" class="label">MCP: status tools</text>

  <!-- remediation-hosted-agent -> MCP server: exits below Search box, then joins the same merge point -->
  <path class="conn" d="M1460 985 H1860 V1060" stroke="#07875c" stroke-width="5"/>
  <text x="1740" y="1000" text-anchor="middle" class="label">MCP: bounded update</text>

  <!-- merged trunk -> MCP server -->
  <path class="conn" d="M1860 1060 H895 V1175" stroke="#07875c" stroke-width="5" marker-end="url(#arrow-green)"/>

  <!-- MCP server -> Audit API -->
  <path class="conn" d="M1090 1223 H1200" stroke="#07875c" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1145" y="1206" text-anchor="middle" class="label">HTTPS</text>

  <!-- Audit API -> SQLite -->
  <path class="conn" d="M1590 1223 H1685" stroke="#07875c" stroke-width="5" marker-end="url(#arrow-green)"/>
  <text x="1638" y="1206" text-anchor="middle" class="label">reads / writes</text>

  <!-- approval callout -->
  <g filter="url(#shadow)">
    <rect x="70" y="790" width="255" height="170" rx="20" fill="#fff7ed" stroke="#d97706" stroke-width="3"/>
    <text x="197" y="828" text-anchor="middle" class="node-title" fill="#92400e">Human approval gate</text>
    <text x="197" y="866" text-anchor="middle" class="node-sub">Analyze first</text>
    <text x="197" y="896" text-anchor="middle" class="node-sub">Approve explicitly</text>
    <text x="197" y="926" text-anchor="middle" class="node-sub">Then remediate</text>
  </g>
  <path class="conn" d="M205 650 V790" stroke="#d97706" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow-orange)"/>

  <!-- legend -->
  <rect x="70" y="1100" width="255" height="170" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="100" y="1140" class="node-title">Legend</text>
  <line x1="100" y1="1170" x2="160" y2="1170" stroke="#2563eb" stroke-width="5"/><text x="180" y="1177" class="small">A2A</text>
  <line x1="100" y1="1205" x2="160" y2="1205" stroke="#07875c" stroke-width="5"/><text x="180" y="1212" class="small">MCP / HTTP</text>
  <line x1="100" y1="1240" x2="160" y2="1240" stroke="#d97706" stroke-width="5" stroke-dasharray="10 10"/><text x="180" y="1247" class="small">approval</text>

  <text x="1200" y="1318" text-anchor="middle" class="footer">Conceptual workshop POC • audit data and remediation actions are simulated • not legal advice or production authorization</text>
</svg>
